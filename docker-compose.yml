services:
  smartdns:
    build: .
    container_name: smartdns
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "80:80/tcp"
      - "443:443/tcp"
      - "8443:8443/tcp"
    volumes:
      - ./config.yaml:/etc/smartdns/config.yaml:ro
      # Not :ro — `smartdns add-domain` / `smartdns add-ip` write to these.
      - ./domains.txt:/etc/smartdns/domains.txt
      - ./allowed_ips.txt:/etc/smartdns/allowed_ips.txt
      - ./certs:/etc/smartdns/certs:ro
    environment:
      # Backstop for the Go garbage collector: keep the heap under the
      # container's memory limit instead of relying on GOGC alone, so the
      # process shrinks its own memory rather than getting OOM-killed.
      - GOMEMLIMIT=224MiB
      # Matches the cpus limit below so the Go scheduler doesn't spin up
      # more OS threads than the container is actually allowed to use.
      - GOMAXPROCS=1
    # Hard resource ceiling enforced by the container runtime (cgroups).
    # Applies directly to `docker compose up`, no swarm required.
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 1.0
    # Cap the json-file log driver so a noisy/long-running container can't
    # fill the disk: 3 files x 10MB = 30MB max for this service's logs,
    # rotated automatically instead of growing forever.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
